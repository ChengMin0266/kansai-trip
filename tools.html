<!-- kansai-tools: 页签条 + 汇率/记账页。构建时整块插入 </body> 前；行程内容外层需有 id="pane-trip" -->
<style>
  body{padding-bottom:calc(64px + env(safe-area-inset-bottom))}
  #sheetbar{
    position:fixed; left:0; right:0; bottom:0; z-index:80;
    display:flex; align-items:flex-end; gap:2px;
    background:var(--panel); border-top:1px solid var(--line);
    padding:6px 10px 0; padding-bottom:env(safe-area-inset-bottom);
  }
  #sheetbar button{
    appearance:none; font-family:inherit; font-size:13.5px; letter-spacing:.05em; cursor:pointer;
    color:var(--ink-2); background:transparent; border:1px solid transparent; border-bottom:none;
    padding:8px 20px 9px; border-radius:7px 7px 0 0;
  }
  #sheetbar button.on{
    background:var(--paper); color:var(--ink); font-weight:600;
    border-color:var(--line); box-shadow:0 1px 0 var(--paper);
  }
  #pane-tools h2:first-of-type{margin-top:8px}
  .tool-card{
    border:1px solid var(--line); border-radius:6px; background:var(--panel);
    padding:16px 18px; margin-bottom:14px;
  }
  .rate-line{font-size:13.5px; color:var(--ink-2); display:flex; flex-wrap:wrap; gap:6px 14px; align-items:center}
  .rate-line b{color:var(--ink); font-variant-numeric:tabular-nums}
  .rate-refresh{
    appearance:none; font-family:inherit; font-size:12.5px; cursor:pointer;
    border:1px solid var(--line); border-radius:4px; background:var(--paper); color:var(--ink-2); padding:3px 12px;
  }
  .cv-row{display:flex; flex-wrap:wrap; gap:10px; margin-top:12px}
  .cv-cell{flex:1 1 140px; min-width:120px}
  .cv-cell label{display:block; font-size:12px; letter-spacing:.1em; color:var(--chip-mute); margin-bottom:4px}
  .cv-cell input{
    width:100%; box-sizing:border-box; font-family:inherit; font-size:20px; font-variant-numeric:tabular-nums;
    padding:8px 10px; border:1px solid var(--line); border-radius:5px; background:var(--paper); color:var(--ink);
  }
  .cv-out{
    font-size:20px; font-variant-numeric:tabular-nums; padding:8px 10px;
    border:1px dashed var(--line); border-radius:5px; color:var(--ink); background:var(--paper); min-height:1.4em;
  }
  .lg-form{display:flex; flex-wrap:wrap; gap:10px; margin-top:4px}
  .lg-form .who{display:flex; gap:6px}
  .lg-form .who button{
    appearance:none; font-family:inherit; font-size:14px; cursor:pointer; letter-spacing:.05em;
    border:1px solid var(--line); border-radius:5px; background:var(--paper); color:var(--ink-2); padding:8px 18px;
  }
  .lg-form .who button.on{background:var(--kobe); border-color:var(--kobe); color:#fff; font-weight:600}
  .lg-form .who button[data-who="mj"].on{background:var(--kyoto); border-color:var(--kyoto)}
  .lg-form input[type=text]{flex:2 1 160px}
  .lg-form input[type=number]{flex:1 1 90px; min-width:90px}
  .lg-form input, .lg-form select{
    box-sizing:border-box; font-family:inherit; font-size:15px;
    padding:8px 10px; border:1px solid var(--line); border-radius:5px; background:var(--paper); color:var(--ink);
  }
  .lg-form select{flex:0 1 auto}
  .lg-add{
    appearance:none; font-family:inherit; font-size:14px; font-weight:600; cursor:pointer;
    border:none; border-radius:5px; background:var(--shu); color:#fff; padding:8px 22px;
  }
  .lg-sum{display:flex; flex-wrap:wrap; gap:10px; margin-top:14px}
  .sum-card{
    flex:1 1 150px; min-width:140px; border:1px solid var(--line); border-radius:6px;
    background:var(--paper); padding:10px 14px;
  }
  .sum-card .nm{font-size:12px; letter-spacing:.14em; color:var(--chip-mute)}
  .sum-card .tt2{font-size:19px; font-weight:600; font-variant-numeric:tabular-nums; margin:2px 0}
  .sum-card .bd{font-size:12px; color:var(--ink-2); font-variant-numeric:tabular-nums; line-height:1.6}
  .lg-list{list-style:none; margin:14px 0 0; padding:0}
  .lg-list li{
    display:flex; gap:10px; align-items:baseline; padding:8px 2px;
    border-bottom:1px solid var(--line); font-size:14px;
  }
  .lg-list li:last-child{border-bottom:none}
  .lg-list .w{flex:0 0 auto; font-size:11.5px; letter-spacing:.08em; padding:1px 8px; border-radius:3px; background:var(--kobe-bg); color:var(--kobe)}
  .lg-list .w.mj{background:var(--kyoto-bg); color:var(--kyoto)}
  .lg-list .d{flex:1 1 auto; overflow-wrap:anywhere}
  .lg-list .a{flex:0 0 auto; font-variant-numeric:tabular-nums; font-weight:600}
  .lg-list .del{
    flex:0 0 auto; appearance:none; border:none; background:transparent; cursor:pointer;
    color:var(--chip-mute); font-size:15px; padding:0 4px; line-height:1;
  }
  .tool-note{font-size:12px; color:var(--chip-mute); margin-top:10px; line-height:1.6}
</style>

<div class="wrap" id="pane-tools" hidden>
  <h2>汇率<span class="en">RATES · JPY 基准</span></h2>
  <div class="tool-card">
    <div class="rate-line">
      <span>100 円 ≈ <b id="r-cny">–</b> 人民币 · <b id="r-gbp">–</b> 英镑</span>
      <button class="rate-refresh" id="r-btn">↻ 更新汇率</button>
      <span id="r-ts" style="font-size:12px"></span>
    </div>
    <div class="cv-row">
      <div class="cv-cell"><label>日元 円</label><input id="cv-jpy" type="number" inputmode="decimal" placeholder="输入日元"></div>
      <div class="cv-cell"><label>人民币 ¥</label><div class="cv-out" id="cv-cny">–</div></div>
      <div class="cv-cell"><label>英镑 £</label><div class="cv-out" id="cv-gbp">–</div></div>
    </div>
  </div>

  <h2>记账<span class="en">LEDGER</span></h2>
  <div class="tool-card">
    <div class="lg-form">
      <div class="who">
        <button type="button" data-who="mc" class="on">mc</button>
        <button type="button" data-who="mj">mj</button>
      </div>
      <input id="lg-desc" type="text" placeholder="内容（如：抹茶甜品）">
      <input id="lg-amt" type="number" inputmode="decimal" placeholder="金额">
      <select id="lg-cur">
        <option value="JPY">日元 円</option>
        <option value="CNY">人民币 ¥</option>
        <option value="GBP">英镑 £</option>
      </select>
      <button class="lg-add" id="lg-add">记一笔</button>
    </div>
    <div class="lg-sum" id="lg-sum"></div>
    <ul class="lg-list" id="lg-list"></ul>
    <p class="tool-note">账目存在本机浏览器里（离线可用，不跨设备同步）；汇总按当前汇率折算成人民币。删除某笔点右侧 ×。</p>
  </div>
</div>

<div id="sheetbar">
  <button type="button" data-pane="trip" class="on">📋 行程</button>
  <button type="button" data-pane="tools">💴 汇率 · 记账</button>
</div>

<script>
(function(){
  'use strict';
  var $=function(id){return document.getElementById(id)};
  /* ---- 页签 ---- */
  var panes={trip:$('pane-trip'),tools:$('pane-tools')};
  var tabs=document.querySelectorAll('#sheetbar button');
  tabs.forEach(function(b){b.addEventListener('click',function(){
    tabs.forEach(function(x){x.classList.toggle('on',x===b)});
    Object.keys(panes).forEach(function(k){panes[k].hidden=(k!==b.dataset.pane)});
    window.scrollTo(0,0);
  })});

  /* ---- 汇率 ---- */
  var RKEY='kansai_rates_v1', rates=null;
  try{rates=JSON.parse(localStorage.getItem(RKEY)||'null')}catch(e){}
  function fmt(n,d){return n.toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d})}
  function renderRates(){
    if(!rates){$('r-cny').textContent='–';$('r-gbp').textContent='–';$('r-ts').textContent='（尚未获取，点「更新汇率」）';return}
    $('r-cny').textContent=fmt(rates.cny*100,2);
    $('r-gbp').textContent=fmt(rates.gbp*100,3);
    $('r-ts').textContent='更新于 '+new Date(rates.ts).toLocaleString('zh-CN',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'});
    convert(); renderSum();
  }
  function saveRates(c,g){rates={cny:c,gbp:g,ts:Date.now()};try{localStorage.setItem(RKEY,JSON.stringify(rates))}catch(e){};renderRates()}
  function fetchRates(){
    $('r-btn').textContent='…';
    fetch('https://open.er-api.com/v6/latest/JPY').then(function(r){return r.json()})
      .then(function(j){if(j&&j.rates&&j.rates.CNY&&j.rates.GBP){saveRates(j.rates.CNY,j.rates.GBP)}else{throw 0}})
      .catch(function(){
        return fetch('https://api.frankfurter.app/latest?from=JPY&to=CNY,GBP').then(function(r){return r.json()})
          .then(function(j){if(j&&j.rates&&j.rates.CNY&&j.rates.GBP){saveRates(j.rates.CNY,j.rates.GBP)}})
          .catch(function(){ $('r-ts').textContent='获取失败（离线？），沿用上次汇率'; });
      })
      .then(function(){$('r-btn').textContent='↻ 更新汇率'});
  }
  $('r-btn').addEventListener('click',fetchRates);

  /* ---- 换算 ---- */
  function convert(){
    var v=parseFloat($('cv-jpy').value);
    if(!rates||isNaN(v)){$('cv-cny').textContent='–';$('cv-gbp').textContent='–';return}
    $('cv-cny').textContent='¥ '+fmt(v*rates.cny,2);
    $('cv-gbp').textContent='£ '+fmt(v*rates.gbp,2);
  }
  $('cv-jpy').addEventListener('input',convert);

  /* ---- 记账 ---- */
  var LKEY='kansai_ledger_v1', ledger=[];
  try{ledger=JSON.parse(localStorage.getItem(LKEY)||'[]')||[]}catch(e){}
  function saveLedger(){try{localStorage.setItem(LKEY,JSON.stringify(ledger))}catch(e){}}
  var who='mc';
  document.querySelectorAll('.lg-form .who button').forEach(function(b){
    b.addEventListener('click',function(){
      who=b.dataset.who;
      document.querySelectorAll('.lg-form .who button').forEach(function(x){x.classList.toggle('on',x===b)});
    });
  });
  var SYM={JPY:'円',CNY:'¥',GBP:'£'};
  function toCny(amt,cur){
    if(!rates)return null;
    if(cur==='CNY')return amt;
    if(cur==='JPY')return amt*rates.cny;
    return amt*rates.cny/rates.gbp; /* GBP */
  }
  function fmtAmt(amt,cur){return (cur==='JPY'?fmt(amt,0):fmt(amt,2))+' '+SYM[cur]}
  function renderSum(){
    var box=$('lg-sum'); box.textContent='';
    ['mc','mj','合计'].forEach(function(k){
      var rows=(k==='合计')?ledger:ledger.filter(function(e){return e.who===k});
      var per={JPY:0,CNY:0,GBP:0}, cny=0, incomplete=false;
      rows.forEach(function(e){per[e.cur]+=e.amt; var c=toCny(e.amt,e.cur); if(c===null){incomplete=true}else{cny+=c}});
      var card=document.createElement('div'); card.className='sum-card';
      var nm=document.createElement('div'); nm.className='nm'; nm.textContent=k.toUpperCase(); card.appendChild(nm);
      var tt=document.createElement('div'); tt.className='tt2';
      tt.textContent=incomplete?'≈ ¥ –（要先更新汇率）':'≈ ¥ '+fmt(cny,2); card.appendChild(tt);
      var bd=document.createElement('div'); bd.className='bd';
      var parts=[];
      if(per.JPY)parts.push(fmt(per.JPY,0)+' 円');
      if(per.CNY)parts.push('¥'+fmt(per.CNY,2));
      if(per.GBP)parts.push('£'+fmt(per.GBP,2));
      bd.textContent=parts.length?parts.join(' + '):'暂无记录';
      card.appendChild(bd); box.appendChild(card);
    });
  }
  function renderList(){
    var ul=$('lg-list'); ul.textContent='';
    ledger.slice().reverse().forEach(function(e){
      var li=document.createElement('li');
      var w=document.createElement('span'); w.className='w'+(e.who==='mj'?' mj':''); w.textContent=e.who; li.appendChild(w);
      var d=document.createElement('span'); d.className='d'; d.textContent=e.desc; li.appendChild(d);
      var a=document.createElement('span'); a.className='a'; a.textContent=fmtAmt(e.amt,e.cur); li.appendChild(a);
      var x=document.createElement('button'); x.className='del'; x.textContent='×'; x.setAttribute('aria-label','删除');
      x.addEventListener('click',function(){ledger=ledger.filter(function(t){return t.id!==e.id});saveLedger();renderSum();renderList()});
      li.appendChild(x); ul.appendChild(li);
    });
  }
  $('lg-add').addEventListener('click',function(){
    var desc=$('lg-desc').value.trim(), amt=parseFloat($('lg-amt').value), cur=$('lg-cur').value;
    if(!desc||isNaN(amt)||amt<=0){$('lg-desc').focus();return}
    ledger.push({id:Date.now()+Math.random().toString(16).slice(2),who:who,desc:desc,amt:amt,cur:cur,ts:Date.now()});
    saveLedger(); $('lg-desc').value=''; $('lg-amt').value='';
    renderSum(); renderList();
  });

  renderRates(); renderSum(); renderList();
  if(!rates||Date.now()-rates.ts>6*3600*1000){ if(navigator.onLine!==false) fetchRates(); }
})();
</script>
